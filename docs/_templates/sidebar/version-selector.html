{# 版本切换器 #}
{% if versions %}
<div class="sidebar-tree">
  <p class="caption" role="heading">
    <span class="caption-text">版本</span>
  </p>
  <ul>
    {% for version in versions %}
    <li class="toctree-l1 {% if version.name == current_version %}current{% endif %}">
      <a class="reference internal" href="{{ version.url }}">{{ version.name }}</a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endif %}
