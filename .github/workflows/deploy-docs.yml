name: Deploy Multi-dimensional Documentation

on:
  push:
    branches: 
      - torchscript_export
      - chinese_annotated
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史
        
    - name: Fetch all branches  
      run: |
        git fetch --all
        git branch -a

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz

    - name: Cache conda environment
      uses: actions/cache@v3
      with:
        path: ~/conda_pkgs_dir
        key: ${{ runner.os }}-conda-${{ hashFiles('docs/environment.yml') }}

    - name: Setup Conda environment
      uses: conda-incubator/setup-miniconda@v2
      with:
        environment-file: docs/environment.yml
        activate-environment: hamgnn-docs
        auto-activate-base: false

    - name: Build multi-dimensional documentation
      shell: bash -l {0}
      run: |
        cd docs
        
        # 确保脚本可执行
        chmod +x build_docs.py
        
        # 构建所有文档（暂时跳过翻译生成）
        python build_docs.py
        
        # 显示构建结果
        echo "=== 构建完成，文档结构 ==="
        find _build/all_docs -type d -name "zh" -o -name "en" | sort

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/all_docs
        force_orphan: true
        commit_message: "Deploy 3D documentation from ${{ github.ref_name }} [skip ci]"